# M1-2: lint, typecheck, unit, API integration and e2e tests on every push.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest projects: domain and scale unit tests, api integration tests, web component tests.
      - run: pnpm test

  e2e:
    name: E2E (Playwright, phone viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: macrofill
          POSTGRES_PASSWORD: macrofill
          POSTGRES_DB: macrofill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrofill -d macrofill"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://macrofill:macrofill@localhost:5432/macrofill
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @macrofill/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: macrofill
          POSTGRES_PASSWORD: macrofill
          POSTGRES_DB: macrofill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrofill -d macrofill"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: macrofill:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # M4-8, M4-9: refuses an unmigrated schema; migrate, seed and healthcheck work in the image.
      - run: tooling/ci/image-smoke.sh macrofill:ci postgres://macrofill:macrofill@localhost:5432/macrofill
