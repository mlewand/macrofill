# M1-2: lint, typecheck, unit, API integration and e2e tests on every push.
# M1-6: the API tests also run against the host's Postgres version.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest projects: domain and scale unit tests, api integration tests, web component tests.
      # With coverage: below the per-package line thresholds, the run fails (M1-3).
      - run: pnpm test:coverage

  # M1-6: the api tests again, against the host's Postgres version as a service container (the
  # rest of CI runs them on PGlite). The host runs Postgres 17; the maintainer gave the major
  # version as the one to pin (2026-10-01), so the image tag follows its latest minor release.
  api-postgres:
    name: API tests (Postgres 17, the host's version)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: macrofill
          POSTGRES_PASSWORD: macrofill
          POSTGRES_DB: macrofill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrofill -d macrofill"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Each test creates its own database on this server and drops it afterwards.
      API_TEST_DATABASE_URL: postgres://macrofill:macrofill@localhost:5432/macrofill
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project api

  e2e:
    name: E2E (Playwright, phone viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: macrofill
          POSTGRES_PASSWORD: macrofill
          POSTGRES_DB: macrofill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrofill -d macrofill"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://macrofill:macrofill@localhost:5432/macrofill
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @macrofill/web exec playwright install --with-deps chromium
      # Playwright resets its own database (DATABASE_URL + _e2e) before starting the server.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: macrofill
          POSTGRES_PASSWORD: macrofill
          POSTGRES_DB: macrofill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrofill -d macrofill"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: macrofill:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # M4-8, M4-9: refuses an unmigrated schema; migrate, seed and healthcheck work in the image.
      - run: tooling/ci/image-smoke.sh macrofill:ci postgres://macrofill:macrofill@localhost:5432/macrofill

  deploy-script:
    name: Deploy script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Like the LAN box: a Postgres container on its own Docker network, with the app's database
      # and role created as README.md says. Then deploy.sh twice: a first deploy and an update.
      - run: docker network create pg-net
      - run: |
          docker run -d --name host-pg --network pg-net -e POSTGRES_USER=admin -e POSTGRES_PASSWORD=admin postgres:17
          # Over TCP: during init the image runs a temporary server on the socket only, then restarts.
          until docker exec host-pg pg_isready -U admin -h 127.0.0.1; do sleep 1; done
          docker exec host-pg psql -U admin -d postgres \
            -c "CREATE ROLE macrofill LOGIN PASSWORD 'secret';" \
            -c "CREATE DATABASE macrofill OWNER macrofill;"
      - run: printf 'DATABASE_URL=postgres://macrofill:secret@host-pg:5432/macrofill\nPOSTGRES_NETWORK=pg-net\nAPP_PORT=23874\n' > .env
      - run: ./deploy.sh
      - run: curl -sf http://localhost:23874/api/health
      - run: ./deploy.sh
      - run: curl -sf http://localhost:23874/api/health
