# Production on the LAN server. Build and start with:
#   docker compose -f compose.prod.yml up -d --build
# Needs DATABASE_URL and POSTGRES_NETWORK in the environment or a .env file next to this one.
services:
  app:
    build:
      context: .
      args:
        # The git commit, set by deploy.sh; usage events carry it (M7-8).
        APP_VERSION: ${APP_VERSION:-dev}
    image: macrofill:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point at the app's own database and role}
      # Barcode lookup in Open Food Facts and USDA FoodData Central (#66, #67). All optional: empty means the default. The version
      # and the contact make up the User-Agent that Open Food Facts asks for.
      APP_VERSION: ${APP_VERSION:-dev}
      LOOKUP_TIMEOUT_MS: ${LOOKUP_TIMEOUT_MS:-}
      LOOKUP_TOTAL_TIMEOUT_MS: ${LOOKUP_TOTAL_TIMEOUT_MS:-}
      # USDA FoodData Central (#67) is asked only with a key from https://api.data.gov/signup/.
      USDA_API_KEY: ${USDA_API_KEY:-}
      USDA_API_URL: ${USDA_API_URL:-}
      LOOKUP_CONTACT: ${LOOKUP_CONTACT:-}
      OPEN_FOOD_FACTS_URL: ${OPEN_FOOD_FACTS_URL:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    networks:
      - postgres

networks:
  # The existing Docker network the host's Postgres container is on.
  # TODO: the network's name isn't known yet; set POSTGRES_NETWORK.
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:?POSTGRES_NETWORK must name the external Docker network of the host Postgres}
